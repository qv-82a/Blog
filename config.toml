baseURL = 'https://capable-nasturtium-a12ee5.netlify.app/'
theme = 'PaperMod'

defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = true

# 言語設定（日本語と英語）
[languages]
  [languages.ja]
    languageName = '日本語'
    weight = 1
    title = 'QV-82a Notes'  # ←お好きなサイト名に変更してください
    description = 'データ分析・研究・考察ログ'

# 投稿記事
[[languages.ja.menu.main]]
  name = "記事一覧"
  url = "/ja/posts/"
  weight = 10

# カテゴリーをメニューに追加
[[languages.ja.menu.main]]
  name = "カテゴリー"
  url = "/ja/categories/"
  weight = 20

# RSSをメニューに追加
[[languages.ja.menu.main]]
  name = "RSS"
  url = "/ja/index.xml"
  weight = 5

# ここからen設定
  [languages.en]
    languageName = 'English'
    weight = 2
    title = 'QV-82a Notes'  # ←英語版のサイト名
    description = 'Notes and analytical logs on data and research.'

# 投稿記事
[[languages.en.menu.main]]
  name = "Posts"
  url = "/en/posts/"
  weight = 10

# カテゴリーをメニューに追加
[[languages.en.menu.main]]
  name = "Categories"
  url = "/en/categories/"
  weight = 20

# RSSをメニューに追加
[[languages.en.menu.main]]
  name = "RSS"
  url = "/en/index.xml"
  weight = 5

# メニュー（言語切り替えボタン等の表示）
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts/"
    weight = 10

# グローバルな指定
[params]
  mainSections = ["posts"]

# 言語別に定義している場合は、各言語のparams内にも指定します
[languages.en.params]
  mainSections = ["posts"]

[languages.ja.params]
  mainSections = ["posts"]
